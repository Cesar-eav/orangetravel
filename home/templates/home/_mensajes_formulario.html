{# Mensajes de django.contrib.messages tras enviar un formulario público (p. ej. contacto). #}
{% if messages %}
<div class="space-y-3 mb-6" role="status">
    {% for message in messages %}
    <p class="px-4 py-3 rounded-xl text-sm font-semibold {% if message.level_tag == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-green-50 text-green-700 border border-green-200{% endif %}">{{ message }}</p>
    {% endfor %}
</div>
{% endif %}
