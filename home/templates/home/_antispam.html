{% load i18n %}{# Campos antispam (home/antispam.py). Va dentro del <form>, antes del botón. #}
<div aria-hidden="true" style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;">
    <label>{% trans "No llenar este campo" %} <input type="text" name="{{ campo_honeypot }}" value="" tabindex="-1" autocomplete="off"></label>
</div>
<input type="hidden" name="{{ campo_tiempo }}" value="{{ marca_tiempo }}">
{% if turnstile_site_key %}
<div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-language="{{ idioma }}" data-size="flexible"></div>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
{% endif %}
