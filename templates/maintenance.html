{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitio en mantención · Orange Travel</title>
    <link rel="icon" type="image/x-icon" href="{% static 'img/favicon/favicon.ico' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
          crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        :root {
            color-scheme: light;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #fff7ed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: #292524;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px 32px;
            text-align: center;
        }
        .card img {
            max-width: 180px;
            height: auto;
            margin-bottom: 24px;
        }
        .card h1 {
            font-size: 1.5rem;
            margin: 0 0 16px;
            color: #c2410c;
        }
        .card .mensaje {
            font-size: 1rem;
            line-height: 1.6;
            color: #44403c;
        }
        .card .mensaje p:first-child {
            margin-top: 0;
        }
        .card .mensaje p:last-child {
            margin-bottom: 0;
        }
        .contacto {
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid #f0e4d8;
        }
        .contacto h2 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #a8a29e;
            margin: 0 0 14px;
        }
        .contacto ul {
            list-style: none;
            margin: 0 0 20px;
            padding: 0;
            font-size: 0.95rem;
        }
        .contacto li {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .contacto li i {
            color: #c2410c;
            width: 18px;
        }
        .redes {
            display: flex;
            justify-content: center;
            gap: 18px;
        }
        .redes a {
            color: #78716c;
            font-size: 1.75rem;
            transition: color 0.2s;
        }
        .redes a:hover {
            color: #c2410c;
        }
        .whatsapp {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }
        .whatsapp a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #25d366;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 10px 18px;
            border-radius: 999px;
            transition: background 0.2s;
        }
        .whatsapp a:hover {
            background: #128c7e;
        }
        .whatsapp a i {
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="{% static 'img/logotipo.png' %}" alt="Orange Travel">
        <h1>Sitio en mantención</h1>
        <div class="mensaje">{{ mensaje|safe }}</div>

        <div class="contacto">
            <h2>Contacto</h2>
            <ul>
                <li><i class="fa-solid fa-envelope"></i><span>Agenciaorangetravel@gmail.com</span></li>
                <li><i class="fa-solid fa-phone"></i><span>+56 9 8869 3991</span></li>
                <li><i class="fa-solid fa-phone"></i><span>+56 9 3658 4003</span></li>
            </ul>
            <div class="redes">
                <a href="https://www.facebook.com/orangetravelservice" target="_blank" rel="noopener" aria-label="Facebook">
                    <i class="fa-brands fa-facebook"></i>
                </a>
                <a href="https://www.instagram.com/orange.travel.arica/" target="_blank" rel="noopener" aria-label="Instagram">
                    <i class="fa-brands fa-square-instagram"></i>
                </a>
            </div>
            <div class="whatsapp">
                <a href="https://wa.me/56988693991?text=Hola%2C%20quiero%20informaci%C3%B3n" target="_blank" rel="noopener">
                    <i class="fa-brands fa-whatsapp"></i> +56 9 8869 3991
                </a>
                <a href="https://wa.me/56936584003?text=Hola%2C%20quiero%20informaci%C3%B3n" target="_blank" rel="noopener">
                    <i class="fa-brands fa-whatsapp"></i> +56 9 3658 4003
                </a>
            </div>
        </div>
    </div>
</body>
</html>
