{% load i18n %}{% if mostrar_selector_idioma %}{% get_current_language as idioma_actual %}
{# Visible para todos solo con «Sitio en inglés» encendido en el panel; apagado, solo el staff lo ve. #}
<form action="{% url 'set_language' %}" method="post" class="flex items-center gap-1 {{ clase }}">{% csrf_token %}
    <input name="next" type="hidden" value="{{ request.get_full_path }}">
    <button type="submit" name="language" value="es" title="Español" aria-label="Español"{% if idioma_actual == 'es' %} aria-current="true"{% endif %}
        class="flex items-center gap-1.5 rounded-md px-2 py-1 text-xs font-bold transition {% if idioma_actual == 'es' %}bg-white/15 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <svg viewBox="0 0 30 20" class="h-3.5 w-5 rounded-sm shadow" aria-hidden="true"><rect width="30" height="20" fill="#d52b1e"/><rect width="30" height="10" fill="#fff"/><rect width="10" height="10" fill="#0039a6"/><polygon points="5,2.2 5.8,4.6 8.3,4.6 6.3,6.1 7,8.5 5,7 3,8.5 3.7,6.1 1.7,4.6 4.2,4.6" fill="#fff"/></svg>
        ES
    </button>
    <span class="text-white/30" aria-hidden="true">|</span>
    <button type="submit" name="language" value="en" title="English" aria-label="English"{% if idioma_actual == 'en' %} aria-current="true"{% endif %}
        class="flex items-center gap-1.5 rounded-md px-2 py-1 text-xs font-bold transition {% if idioma_actual == 'en' %}bg-white/15 text-white{% else %}text-white/60 hover:text-white{% endif %}">
        <svg viewBox="0 0 60 30" class="h-3.5 w-5 rounded-sm shadow" aria-hidden="true"><rect width="60" height="30" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 60,30M60,0 0,30" stroke="#c8102e" stroke-width="2"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#c8102e" stroke-width="6"/></svg>
        EN
    </button>
    {% if not ingles_publico %}<span class="ml-1 rounded bg-amber-400 px-1.5 py-0.5 text-[10px] font-black uppercase text-blue-dark" title="Solo lo ven usuarios staff hasta activar «Sitio en inglés» en el panel">staff</span>{% endif %}
</form>
{% endif %}
