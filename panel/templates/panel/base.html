<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Panel{% endblock %} · Orange Travel</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--or:#f97316;--or-d:#ea580c;--navy:#293D54;--bg:#f4f5f7;--bd:#e2e5ea;--tx:#1f2937;--mu:#6b7280}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
a{color:var(--or-d);text-decoration:none}a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.side{width:230px;background:var(--navy);color:#fff;padding:20px 14px;flex-shrink:0}
.side h1{font-size:18px;margin:0 0 22px 8px}.side h1 span{color:var(--or)}
.side a{display:block;color:#dbe3ee;padding:11px 12px;border-radius:8px;margin-bottom:4px;font-size:16px}
.side a:hover,.side a.on{background:rgba(255,255,255,.12);color:#fff;text-decoration:none}
.side .user{margin-top:28px;padding:0 8px;font-size:14px;color:#9fb0c6}
.main{flex:1;padding:28px;max-width:1100px}
h2{margin:0 0 18px;font-size:26px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:18px}
.stat b{display:block;font-size:34px;color:var(--or-d)}.stat span{color:var(--mu)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd);font-size:15px;vertical-align:top}
th{color:var(--mu);font-weight:600;font-size:13px;text-transform:uppercase}
.btn{display:inline-block;background:var(--or);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:16px;cursor:pointer}
.btn:hover{background:var(--or-d);text-decoration:none}
.btn.sec{background:#fff;color:var(--tx);border:1px solid var(--bd)}.btn.red{background:#dc2626}
input,select,textarea{font:inherit;padding:9px 10px;border:1px solid #cbd0d8;border-radius:8px;background:#fff;max-width:100%}
textarea{width:100%}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:16px}
.filters label{display:block;font-size:13px;color:var(--mu)}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.b-PENDIENTE,.b-pending{background:#ffedd5;color:#9a3412}.b-CONFIRMADA,.b-paid{background:#dcfce7;color:#166534}
.b-CANCELADA,.b-RECHAZADA,.b-failed,.b-canceled{background:#fee2e2;color:#991b1b}
.msgs{list-style:none;padding:0;margin:0 0 18px}.msgs li{padding:12px 16px;border-radius:8px;margin-bottom:8px;background:#dcfce7;color:#166534}
.msgs li.error{background:#fee2e2;color:#991b1b}
dl{display:grid;grid-template-columns:200px 1fr;gap:8px 16px;margin:0}dt{color:var(--mu)}dd{margin:0}
.pager{display:flex;gap:12px;align-items:center;margin-top:14px}.warn{background:#fff7ed;border:1px solid #fed7aa;padding:10px 14px;border-radius:8px;font-size:14px;margin:10px 0}
@media(max-width:760px){.layout{flex-direction:column}.side{width:auto}.main{padding:16px}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <nav class="side">
    <h1>Orange <span>Travel</span></h1>
    <a href="{% url 'panel:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}on{% endif %}">Inicio</a>
    <a href="{% url 'panel:reservas' %}" class="{% if 'reserva' in request.resolver_match.url_name %}on{% endif %}">Reservas</a>
    <a href="{% url 'panel:pagos' %}" class="{% if 'pago' in request.resolver_match.url_name %}on{% endif %}">Pagos</a>
    <div class="user">{{ request.user.get_username }}
      <form method="post" action="{% url 'panel:logout' %}" style="margin-top:8px">{% csrf_token %}
        <button class="btn sec" style="padding:6px 12px;font-size:14px">Cerrar sesión</button></form>
    </div>
  </nav>
  <main class="main">
    {% if messages %}<ul class="msgs">{% for m in messages %}<li class="{{ m.tags }}">{{ m }}</li>{% endfor %}</ul>{% endif %}
    {% block content %}{% endblock %}
  </main>
</div>
</body>
</html>
